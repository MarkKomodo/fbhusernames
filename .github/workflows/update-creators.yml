name: Update Creator Index

on:
  repository_dispatch:
    types: [new-creators]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests
          
      - name: Update database
        env:
          RAW_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python .github/scripts/update_db.py
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database.json .github/scripts/scrape_cache.json
          git diff --cached --quiet || (git commit -m "Update creator index [automated]" && git push)
